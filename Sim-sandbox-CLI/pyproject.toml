[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simsb"
version = "0.1.0"
description = "Sim-sandbox-CLI — 探针真值标定仿真沙箱（不依赖 GEOFlow）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
simsb = "simsb.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["simsb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
