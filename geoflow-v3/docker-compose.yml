name: geoflow-v3

networks:
  geo-net:
    name: geo-net
    driver: bridge

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: geoflow-v3-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: geo_flow
      POSTGRES_USER: geo_user
      POSTGRES_PASSWORD: geo_password
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geo_user -d geo_flow"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      geo-net:
        aliases: [postgres]

  redis:
    image: redis:7-alpine
    container_name: geoflow-v3-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:16380:6379"
    networks:
      geo-net:
        aliases: [redis]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geoflow-v3-api
    restart: unless-stopped
    env_file: .env
    environment:
      GEOWEB_BASE_URL: ${GEOWEB_BASE_URL:-http://127.0.0.1:3070}
      TECHSTORE_DATABASE_URL: ${TECHSTORE_DATABASE_URL:-postgresql://geo_user:geo_password@postgres:5432/gweb_db}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    ports:
      - "${API_PORT:-18081}:8080"
    volumes:
      - ./backend:/app
      - ./storage/uploads:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      geo-net:
        aliases: [api]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geoflow-v3-worker
    restart: unless-stopped
    env_file: .env
    environment:
      GEOWEB_BASE_URL: ${GEOWEB_BASE_URL:-http://127.0.0.1:3070}
      TECHSTORE_DATABASE_URL: ${TECHSTORE_DATABASE_URL:-postgresql://geo_user:geo_password@postgres:5432/gweb_db}
    command: celery -A app.workers.celery_app worker --loglevel=info -Q celery,geoflow
    volumes:
      - ./backend:/app
      - ./storage/uploads:/app/storage/uploads
    depends_on:
      - api
      - redis
    networks:
      - geo-net

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geoflow-v3-scheduler
    restart: unless-stopped
    env_file: .env
    command: celery -A app.workers.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      - worker
    networks:
      - geo-net

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geoflow-v3-flower
    env_file: .env
    command: celery -A app.workers.celery_app flower --port=5555
    ports:
      - "127.0.0.1:15555:5555"
    depends_on:
      - worker
    networks:
      - geo-net

  geoflow-admin:
    build:
      context: ./apps/geoflow-admin
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://api:8080
    container_name: geoflow-v3-admin
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8080
      NEXT_PUBLIC_API_URL: http://127.0.0.1:${API_PORT:-18081}
    ports:
      - "${ADMIN_PORT:-13001}:3000"
    depends_on:
      - api
    networks:
      - geo-net
