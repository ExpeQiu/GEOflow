name: geoflow-laravel

# vendor 使用命名卷，避免外置盘（exFAT 等）bind mount 导致 composer 解压/符号链接不完整
volumes:
  geoflow-vendor:

x-geoflow-php-common: &geoflow-php-common
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  postgres:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg16}
    container_name: geoflow-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-geo_flow}
      POSTGRES_USER: ${DB_USERNAME:-geo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-geo_password}
    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-15432}:5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-./docker-data/dev/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-geo_user} -d ${DB_DATABASE:-geo_flow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: geoflow-redis
    ports:
      - "127.0.0.1:${REDIS_EXPOSE_PORT:-16379}:6379"
    restart: unless-stopped

  init:
    <<: *geoflow-php-common
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-php:8.4-cli-bookworm}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-https://mirrors.aliyun.com/composer/}
    container_name: geoflow-init
    working_dir: /var/www/html
    env_file:
      - ./.env
    # 交给 entrypoint 执行自动初始化（生成 APP_KEY / migrate / seed）
    command: ["php", "artisan", "about"]
    environment:
      AUTO_GENERATE_APP_KEY: "true"
      AUTO_INIT_ONCE: "true"
    volumes:
      - ./:/var/www/html
      - geoflow-vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: "no"

  app:
    <<: *geoflow-php-common
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-php:8.4-cli-bookworm}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-https://mirrors.aliyun.com/composer/}
    container_name: geoflow-app
    working_dir: /var/www/html
    env_file:
      - ./.env
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${APP_PORT:-18080}:8080"
    volumes:
      - ./:/var/www/html
      - geoflow-vendor:/var/www/html/vendor
    depends_on:
      init:
        condition: service_completed_successfully
      content-agent:
        condition: service_healthy
    restart: unless-stopped

  queue:
    <<: *geoflow-php-common
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-php:8.4-cli-bookworm}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-https://mirrors.aliyun.com/composer/}
    container_name: geoflow-queue
    working_dir: /var/www/html
    env_file:
      - ./.env
    command: ["php", "artisan", "queue:work", "redis", "--queue=geoflow,geo_eval,distribution,default", "--sleep=1", "--tries=1", "--timeout=300"]
    volumes:
      - ./:/var/www/html
      - geoflow-vendor:/var/www/html/vendor
    depends_on:
      init:
        condition: service_completed_successfully
      content-agent:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    <<: *geoflow-php-common
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-php:8.4-cli-bookworm}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-https://mirrors.aliyun.com/composer/}
    container_name: geoflow-scheduler
    working_dir: /var/www/html
    env_file:
      - ./.env
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./:/var/www/html
      - geoflow-vendor:/var/www/html/vendor
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  reverb:
    <<: *geoflow-php-common
    image: geoflow-app:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PHP_CLI_IMAGE: ${PHP_CLI_IMAGE:-php:8.4-cli-bookworm}
        COMPOSER_PACKAGIST_MIRROR: ${COMPOSER_PACKAGIST_MIRROR:-https://mirrors.aliyun.com/composer/}
    container_name: geoflow-reverb
    working_dir: /var/www/html
    env_file:
      - ./.env
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_EXPOSE_PORT:-18081}:8080"
    volumes:
      - ./:/var/www/html
      - geoflow-vendor:/var/www/html/vendor
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  content-agent:
    build:
      context: ./services/content-agent
      dockerfile: Dockerfile
    container_name: geoflow-content-agent
    environment:
      CONTENT_AGENT_DRIVER: ${CONTENT_AGENT_DRIVER:-langgraph}
      CONTENT_AGENT_CONTRACT_VERSION: ${CONTENT_AGENT_CONTRACT_VERSION:-1.0}
      CONTENT_AGENT_CALLBACK_SECRET: ${CONTENT_AGENT_CALLBACK_SECRET:-}
      LARAVEL_CALLBACK_URL: ${CONTENT_AGENT_CALLBACK_URL:-http://app:8080/internal/content-agent/callback}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=3).read().decode())\" | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
